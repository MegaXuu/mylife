<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyLife</title>
<meta name="description" content="Qu'est-ce que je dois faire maintenant ? Tâches, entretien, plantes, habitudes, courses — hors-ligne.">
<meta name="theme-color" content="#F4F4F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MyLife">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* ==========================================================================
   Squelette provisoire — gris neutres uniquement. Le design réel (tokens,
   typographie, composants) arrive au Lot 2 : ne pas chercher à faire beau ici.
   ========================================================================== */
:root{
  --bg:#F4F4F5;
  --surface:#FFFFFF;
  --surface2:#EAEAEC;
  --border:#D6D6DA;
  --t2:#5B5D63;      /* texte secondaire */
  --tc:#3A3B40;      /* texte clair */
  --tp:#1B1C1F;      /* texte principal */
  --acc:#4B4D53;      /* accent neutre provisoire (Lot 2 : vraie couleur) */
  --danger:#B3261E;
  --radius:12px;
  --dur1:.15s;
  --dur2:.2s;
  --easeout:ease;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--tp);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4;
  -webkit-tap-highlight-color:transparent;
}
h1{font-size:24px;font-weight:600;margin:4px 0 16px;}
p{margin:0 0 8px;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
}

.app{
  padding:max(16px, env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom));
  min-height:100vh;
}
.screen{display:none;}
.screen.active{display:block;}

/* ---------- Tab bar (4 onglets, zone sûre iOS) ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0;
  display:flex;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:40;
}
.tab{
  flex:1;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:56px; padding:8px 4px;
  background:none; border:0;
  color:var(--t2); font-size:12px;
}
.tab.on{color:var(--tp); font-weight:600;}

/* ---------- Feuilles modales ---------- */
.sheet-bg{
  position:fixed; inset:0;
  background:rgba(0,0,0,.4);
  display:none; align-items:flex-end; justify-content:center;
  z-index:50;
}
.sheet-bg.show{display:flex; animation:fadeBg var(--dur2) var(--easeout);}
.sheet{
  background:var(--surface);
  width:100%; max-width:560px;
  border-radius:16px 16px 0 0;
  padding:6px 20px calc(20px + env(safe-area-inset-bottom));
  max-height:85vh; overflow-y:auto; overflow-x:hidden;
}
.sheet-bg.show .sheet{animation:sheetUp .25s var(--easeout);}
@keyframes fadeBg{from{opacity:0;}to{opacity:1;}}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){
  .sheet-bg.show,.sheet-bg.show .sheet{animation:none;}
}
.handle{width:100%;padding:10px 0;display:flex;justify-content:center;touch-action:none;min-height:44px;align-items:center;}
.handle::before{content:'';width:36px;height:4px;border-radius:2px;background:var(--border);display:block;}
.sheet-msg{color:var(--tc);margin:4px 0 16px;}

/* ---------- Toast ---------- */
.toast{
  position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(20px);
  background:var(--tp); color:var(--surface);
  padding:10px 18px; border-radius:10px; font-size:14px;
  opacity:0; pointer-events:none;
  transition:opacity var(--dur2) var(--easeout), transform var(--dur2) var(--easeout);
  z-index:60; max-width:90vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.toast.danger{background:var(--danger);}

/* ---------- Boutons ---------- */
.btn{
  min-height:44px; padding:0 18px;
  border-radius:var(--radius); border:1px solid var(--border);
  background:var(--surface2); color:var(--tp);
}
.btn.primary{background:var(--acc); color:#fff; border-color:var(--acc);}
.btn.danger{background:var(--danger); color:#fff; border-color:var(--danger);}
.btn.ghost{background:none;}
.btn-full{width:100%; display:block; margin-top:10px;}

/* ---------- État vide ---------- */
.empty{text-align:center; color:var(--t2); padding:56px 20px;}
.empty-ic{width:40px; height:40px; margin-bottom:12px; opacity:.5;}
.empty p{margin:0;}

/* ---------- Tâches (Lot 1, minimal) ---------- */
.task-add{display:flex; gap:8px; margin-bottom:16px;}
.task-add input{
  flex:1; min-height:44px; padding:0 14px;
  border-radius:var(--radius); border:1px solid var(--border); background:var(--surface);
}
.task-list{list-style:none; margin:0; padding:0;}
.task-row{display:flex; align-items:center; gap:10px; min-height:44px; padding:6px 0; border-bottom:1px solid var(--border);}
.task-title{flex:1;}
.task-check{
  flex:none; width:44px; height:44px; padding:0;
  background:none; border:0; position:relative;
}
.task-check::before{
  content:''; position:absolute; inset:0; margin:auto; width:22px; height:22px;
  border-radius:50%; border:1.5px solid var(--border); background:var(--surface);
}
.task-del{
  flex:none; width:44px; height:44px; padding:0;
  background:none; border:0; color:var(--t2); font-size:20px; line-height:1;
}
</style>
</head>
<body>
<div class="app">
  <section id="s-today" class="screen active"></section>
  <section id="s-tasks" class="screen"></section>
  <section id="s-maison" class="screen"></section>
  <section id="s-shopping" class="screen"></section>
  <section id="s-habits" class="screen"></section>
  <section id="s-settings" class="screen"></section>
</div>

<nav class="tabbar" id="tabbar">
  <button class="tab on" data-s="today" onclick="go('today')">Aujourd'hui</button>
  <button class="tab" data-s="tasks" onclick="go('tasks')">Tâches</button>
  <button class="tab" data-s="maison" onclick="go('maison')">Maison</button>
  <button class="tab" data-s="shopping" onclick="go('shopping')">Courses</button>
</nav>

<div class="sheet-bg" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<!-- Application en scripts <script> classiques, portée globale unique, aucun
     bundler. ORDRE DE CHARGEMENT IMPÉRATIF (CONVENTIONS.md §1) : les 3
     catalogues d'abord, puis state.js (socle), puis boot.js en dernier.
     Miroir obligatoire dans sw.js (ASSETS) et test.mjs (FILES). -->
<script src="data/rayons.js"></script>
<script src="data/plantes.js"></script>
<script src="data/entretien.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/recur.js"></script>
<script src="js/nlp.js"></script>
<script src="js/today.js"></script>
<script src="js/tasks.js"></script>
<script src="js/maison.js"></script>
<script src="js/plants.js"></script>
<script src="js/habits.js"></script>
<script src="js/shopping.js"></script>
<script src="js/review.js"></script>
<script src="js/settings.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
